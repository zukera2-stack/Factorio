name: Validate project documentation

on:
  push:
    branches: [main, diagnostic/blueprint-rail-undo]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
      - "README.ru.md"
      - "CHANGELOG.md"
      - "ElectrifiedMainline/info.json"
      - ".github/workflows/validate-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
      - "README.ru.md"
      - "CHANGELOG.md"
      - "ElectrifiedMainline/info.json"
      - ".github/workflows/validate-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Check YAML state and Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install "PyYAML>=6,<7"
      - name: Validate documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import unquote
          import yaml

          class StrictLoader(yaml.SafeLoader):
              pass

          def no_duplicate_keys(loader, node):
              result = {}
              for key_node, val_node in node.value:
                  key = loader.construct_object(key_node, deep=True)
                  if key in result:
                      raise ValueError(f"Duplicate YAML key: {key!r} (line {key_node.start_mark.line + 1})")
                  result[key] = loader.construct_object(val_node, deep=True)
              return result

          StrictLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_duplicate_keys)

          root = Path.cwd().resolve()
          state_file = root / "docs/PROJECT_STATE.yaml"
          state = yaml.load(state_file.read_text(encoding="utf-8"), Loader=StrictLoader)
          if not isinstance(state, dict):
              raise SystemExit("Project state must be a YAML mapping")
          required = (
              "schema_version", "project", "user_decisions", "interoperability",
              "implementation", "last_game_test", "next_actions",
              "compatibility_policy", "evidence_policy", "repository_structure",
          )
          for key in required:
              if key not in state:
                  raise SystemExit(f"Missing required YAML section: {key}")
          version = json.loads(
              (root / "ElectrifiedMainline/info.json").read_text(encoding="utf-8")
          )["version"]
          if str(state["project"].get("mod_version")) != version:
              raise SystemExit(
                  f"State version {state['project'].get('mod_version')} != info.json {version}"
              )

          docs = [
              "AGENTS.md", "README.md", "README.ru.md", "CHANGELOG.md",
              "docs/AI_CONTEXT.md", "docs/STATUS.md",
              "docs/ARCHITECTURE.md", "docs/RESEARCH_METHOD.md",
          ]
          # Exclude web URLs and fragment-only anchors. Check local paths only.
          markdown_link = re.compile(r"(?<!!)\[[^\]]+\]\(([^)]+)\)")
          for name in docs:
              file = root / name
              if not file.is_file():
                  raise SystemExit(f"Missing document: {name}")
              content = file.read_text(encoding="utf-8")
              for target in markdown_link.findall(content):
                  target = target.strip().split("#", 1)[0].strip()
                  if not target or "://" in target or target.startswith(("mailto:", "data:")):
                      continue
                  target = unquote(target)
                  dest = (file.parent / target).resolve()
                  if not dest.is_relative_to(root) or not dest.exists():
                      raise SystemExit(f"Broken Markdown link: {name} -> {target}")
          print(f"Validated project state (mod version {version}) and {len(docs)} Markdown documents.")
          PY
