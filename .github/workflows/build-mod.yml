name: Build Factorio mod ZIP

on:
  push:
    branches: [main, diagnostic/blueprint-rail-undo, test/undo-stabilization-018, 'feature/**']
    paths:
      - "ElectrifiedMainline/**"
      - "tests/**"
      - "scripts/sprites/**"
      - "art/sprites/**"
      - ".github/workflows/build-mod.yml"
  pull_request:
    branches: [main]
    paths:
      - "ElectrifiedMainline/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and validate test ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.2
          while IFS= read -r -d '' file; do
            luac5.2 -p "$file"
          done < <(find ElectrifiedMainline -type f -name '*.lua' -print0)
          lua5.2 tests/35kv_topology.lua
          lua5.2 tests/35kv_curve_topology.lua

      - name: Set up Python for experimental sprite atlas
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate 0.1.12 sprite layers and test image QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          info=json.loads(Path("ElectrifiedMainline/info.json").read_text())
          if info["version"] in ("0.1.11","0.1.12"):
              assert Path("scripts/sprites/game_test_pack.py").is_file()
          PY
          if grep -Eq '"version": "0.1.1(1|2)"' ElectrifiedMainline/info.json; then
            python -m pip install -r scripts/sprites/requirements.txt
            python scripts/sprites/game_test_pack.py --mode demo --mod-dir ElectrifiedMainline --out build/sprites/game-test
            if grep -q '"version": "0.1.12"' ElectrifiedMainline/info.json; then
              python scripts/sprites/split_012.py --graphics-dir ElectrifiedMainline/graphics/entity/35kv --report build/sprites/game-test/split-012.json
            fi
            python -m unittest discover -s scripts/sprites -p 'test_*.py' -v
          fi

      - name: Validate metadata and build archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          mod_dir = Path("ElectrifiedMainline")
          info_path = mod_dir / "info.json"
          if not info_path.is_file():
              raise SystemExit("ERROR: ElectrifiedMainline/info.json is missing")

          info = json.loads(info_path.read_text(encoding="utf-8"))
          required = ("name", "version", "title", "author", "factorio_version")
          missing = [key for key in required if not isinstance(info.get(key), str) or not info[key].strip()]
          if missing:
              raise SystemExit("ERROR: invalid or missing info.json fields: " + ", ".join(missing))
          if info["name"] != "ElectrifiedMainline":
              raise SystemExit("ERROR: unexpected mod name")
          if info["factorio_version"] != "2.1":
              raise SystemExit("ERROR: expected factorio_version 2.1")
          for required_file in ("control.lua", "data.lua"):
              if not (mod_dir / required_file).is_file():
                  raise SystemExit(f"ERROR: {required_file} is missing")

          output_dir = Path("dist")
          output_dir.mkdir(parents=True, exist_ok=True)
          # Historical ZIPs are tracked in this repository. Do not include
          # them in the release artifact for the version being built.
          # This deletion affects only the checkout in the CI runner.
          for stale_archive in output_dir.glob("ElectrifiedMainline_*.zip"):
              stale_archive.unlink()
          archive = output_dir / f'{info["name"]}_{info["version"]}.zip'
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(mod_dir.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.as_posix())

          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              root = mod_dir.name + "/"
              if root + "info.json" not in names:
                  raise SystemExit("ERROR: info.json is not at the ZIP mod-folder root")
              if any(name.startswith(root + mod_dir.name + "/") for name in names):
                  raise SystemExit("ERROR: ZIP contains a duplicated nested mod directory")
              packaged_info = json.loads(zf.read(root + "info.json"))
              if packaged_info != info:
                  raise SystemExit("ERROR: packaged info.json differs from source")

          if info["version"] == "0.1.11":
              expected = (
                  "graphics/entity/35kv/pole-4dir-hr.png",
                  "graphics/entity/35kv/pole-shadow-4dir-hr.png",
                  "graphics/entity/35kv/contact-wire-hr.png",
              )
              for suffix in expected:
                  if root + suffix not in names:
                      raise SystemExit("ERROR: 0.1.11 sprite missing from mod ZIP: " + suffix)
              if len([n for n in names if n.endswith("pole-4dir-hr.png")]) != 1:
                  raise SystemExit("ERROR: duplicate pole atlas")
          if info["version"] == "0.1.12":
              for suffix in ("pole-mast-hr.png","pole-arm-hr.png","pole-shadow-static-hr.png","contact-wire-hr.png"):
                  name=root+"graphics/entity/35kv/"+suffix
                  if names.count(name)!=1:
                      raise SystemExit("ERROR: missing/duplicate 0.1.12 sprite "+name)
          print(f"Built and validated {archive}")
          print(f"Entries: {len(names)}")
          print(f"Mod: {info['name']} {info['version']} / Factorio {info['factorio_version']}")
          PY

      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ElectrifiedMainline-test-build
          # The build step removes obsolete archives; assert the artifact
          # contains only the ZIP matching info.json.
          path: dist/ElectrifiedMainline_*.zip
          if-no-files-found: error
          retention-days: 30
