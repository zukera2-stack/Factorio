name: Build Factorio mod ZIP

on:
  push:
    branches: [main, diagnostic/blueprint-rail-undo, test/undo-stabilization-018, 'feature/**', 'experiment/**']
    paths:
      - "ElectrifiedMainline/**"
      - "tests/**"
      - "scripts/sprites/**"
      - "scripts/verify_*.py"
      - "scripts/package_mod.py"
      - "scripts/atlas_045.py"
      - "docs/tests/evidence/SPRITES_039_QA.json"
      - "docs/builds/013-payload.json"
      - "art/sprites/**"
      - ".github/workflows/build-mod.yml"
  pull_request:
    branches: [main]
    paths:
      - "ElectrifiedMainline/**"
      - "tests/**"
      - "scripts/**"
      - "docs/tests/evidence/SPRITES_039_QA.json"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and validate test ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.2
          while IFS= read -r -d '' file; do
            luac5.2 -p "$file"
          done < <(find ElectrifiedMainline -type f -name '*.lua' -print0)
          lua5.2 tests/35kv_topology.lua
          lua5.2 tests/35kv_facing_022.lua
          lua5.2 tests/35kv_ghost_023.lua
          lua5.2 tests/25kv_native_wire_probe_026.lua
          lua5.2 tests/25kv_auto_wire_028.lua
          lua5.2 tests/25kv_span_029.lua
          if grep -q '"version": "0.1.42"' ElectrifiedMainline/info.json; then
            lua5.2 tests/25kv_art_030.lua
            lua5.2 tests/25kv_visual_042.lua
          fi
          if grep -q '"version": "0.1.43"' ElectrifiedMainline/info.json; then
            lua5.2 tests/25kv_curve_sprites_043.lua
          fi
          if grep -q '"version": "0.1.44"' ElectrifiedMainline/info.json; then
            lua5.2 tests/25kv_visual_042.lua
            lua5.2 tests/25kv_curve_chord_044.lua
          fi


          if grep -q '"version": "0.1.45"' ElectrifiedMainline/info.json; then
            lua5.2 tests/25kv_visual_042.lua
            lua5.2 tests/25kv_unified_geometry_045.lua
          fi
          if grep -q '"version": "0.1.46"' ElectrifiedMainline/info.json; then
            lua5.2 tests/25kv_visual_042.lua
            lua5.2 tests/25kv_visual_geometry_046.lua
            lua5.2 tests/25kv_technical_046.lua
            lua5.2 tests/25kv_preview_046.lua
          fi
          if grep -q '"version": "0.1.47"' ElectrifiedMainline/info.json; then
            lua5.2 tests/25kv_visual_042.lua
            lua5.2 tests/25kv_visual_geometry_047.lua
            lua5.2 tests/25kv_technical_047.lua
            lua5.2 tests/25kv_preview_046.lua
            lua5.2 tests/25kv_policy_047.lua
          fi
          if grep -q '"version": "0.1.48"' ElectrifiedMainline/info.json; then
            lua5.2 tests/25kv_visual_042.lua
            lua5.2 tests/25kv_visual_geometry_048.lua
            lua5.2 tests/25kv_technical_048.lua
            lua5.2 tests/25kv_policy_047.lua
            lua5.2 tests/25kv_continuity_048.lua
          fi

      - name: Set up Python for experimental sprite atlas
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate 0.1.42 user-accepted PNG hashes and layout
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"version": "0.1.42"' ElectrifiedMainline/info.json; then
            python3 scripts/verify_042_assets.py
          fi

      - name: Validate 0.1.43 approved copper/steel sprite PNGs
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"version": "0.1.43"' ElectrifiedMainline/info.json; then
            python3 scripts/verify_043_assets.py
          fi

      - name: Verify 0.1.44 visual and stable rail topology SHA256
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"version": "0.1.44"' ElectrifiedMainline/info.json; then
            python3 scripts/verify_044_assets.py
          fi

      - name: Verify 0.1.45 artwork, graph and pixel atlas
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"version": "0.1.45"' ElectrifiedMainline/info.json; then
            python -m pip install "Pillow>=11,<13"
            python scripts/verify_045_assets.py
            python scripts/atlas_045.py
          fi

      - name: Verify isolated 0.1.46 art and technical contracts
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"version": "0.1.46"' ElectrifiedMainline/info.json; then
            python -m pip install "Pillow>=11,<13"
            python scripts/verify_046_assets.py
            python scripts/atlas_045.py
          fi

      - name: Verify 0.1.47 art and HSR-gated electrical policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"version": "0.1.47"' ElectrifiedMainline/info.json; then
            python -m pip install "Pillow>=11,<13"
            python scripts/verify_047_assets.py
            python scripts/atlas_045.py
          fi

      - name: Verify 0.1.48 visual continuity and approved assets
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"version": "0.1.48"' ElectrifiedMainline/info.json; then
            python -m pip install "Pillow>=11,<13"
            python scripts/verify_048_assets.py
            python scripts/atlas_045.py
          fi

      - name: Validate package boundary
        run: python -m unittest discover -s tests -p 'test_package_mod.py' -v

      - name: Validate metadata and build game-only archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_mod.py
          version=$(python -c 'import json; print(json.load(open("ElectrifiedMainline/info.json"))["version"])')
          echo "archive=build/package/ElectrifiedMainline_${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload 045 geometry atlas
        if: ${{ hashFiles('build/qa/geometry-045-atlas.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: geometry-045-atlas
          path: build/qa/geometry-045-atlas.png
          if-no-files-found: error

      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ElectrifiedMainline-test-build
          # Exact versioned game ZIP; no wildcard, no atlas or historical ZIP.
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
