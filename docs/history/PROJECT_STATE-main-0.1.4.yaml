# Historical `main` branch 0.1.4 state (2026-11-10). Not authoritative for current 0.1.8; see ../PROJECT_STATE.yaml.
schema_version: 1
project:
  name: Electrified Mainline
  repository: https://github.com/zukera2-stack/Factorio
  default_branch: main
  mod_directory: ElectrifiedMainline
  mod_version: "0.1.4"
  diagnostic_test_version: "0.1.5"
  diagnostic_test_branch: diagnostic/blueprint-rail-undo
  diagnostic_test_branch_isolated: true
  factorio_target: "2.1"
