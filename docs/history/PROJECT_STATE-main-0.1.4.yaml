latest_game_test:
  date: "2026-11-10"
  game_version: "2.1.20b"
  tested_mod_version: unknown
  scenarios:
    direct_custom_planner_over_vanilla_rails:
      result: pass
      notes: vanilla_rails_replaced_and_returned_to_inventory
    cancel_direct_replacement:
      result: pass
      notes: custom_rails_removed_then_vanilla_rail_ghosts_restored_by_robots
    custom_rail_ghost_over_vanilla_rails:
      result: fail
      notes: ghost_reports_existing_rails_as_obstruction
    custom_blueprint_on_empty_ground:
      result: pass
      notes: robots_build_custom_rail_ghosts
    cancel_custom_ghosts_on_empty_ground:
      result: pass
    ctrl_shift_blueprint_over_vanilla_rails:
      result: partial_pass
      notes: vanilla_rails_deconstructed_then_custom_rail_ghosts_built_by_robots
    undo_or_cancel_after_ctrl_shift_replacement:
      result: unresolved
      notes: user_says_cancellation_does_not_work_but_did_not_specify_ctrl_z_vs_cancelling_deconstruction_or_removing_ghost
  diagnostic_branch:
    branch: diagnostic/blueprint-rail-undo
    pull_request: https://github.com/zukera2-stack/Factorio/pull/4
    mod_version: "0.1.5"
    ci_lua_syntax_and_package: passed
    in_game_test: not_reported
    merge_to_main: prohibited_until_diagnostic_review

historical_confirmed:
  mod_load_factorio_2_1_20b: passed
  reorganized_root_loaders_and_require_paths: game_tested
  construction_robots_build_custom_rails: game_tested
  custom_curved_and_half_diagonal_rail_identity_detection: game_tested
  bob_library_ingredient_format: explicit_factorio_2x_objects_added_retest_required
  concrete_beam_pipe_ingredient: vanilla_pipe_used_instead_of_nonexistent_iron_pipe
  runtime_pending_queue_nil_crash: user_reported_and_defensive_initialization_fix_added
  green_upgrade_planner_pairs: absent_despite_prototype_eligibility_checks

next_actions:
  - establish_exact_meaning_of_failed_ctrl_shift_cancellation_or_undo
  - obtain_or_analyze_diagnostic_0_1_5_factorio_log_for_ctrl_z_ctrl_y_sequence
  - inspect_undo_redo_action_arrays_before_implementing_reversible_replacement
  - game_test_custom_selection_tool_and_robot_replacement
  - test_all_four_rail_geometries_directions_and_qualities
  - test_mixed_selection_area_does_not_replace_existing_custom_rails
  - test_replacement_with_and_without_construction_robots
  - test_deconstruction_cancellation_and_ghost_removal
  - verify_signals_stations_train_routes_and_refund_counts_after_replacement
  - retest_explicit_recipe_ingredient_format_with_bobs_library
