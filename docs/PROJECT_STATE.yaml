schema_version: 1
project:
  name: Electrified Mainline
  repository: https://github.com/zukera2-stack/Factorio
  default_branch: main
  mod_directory: ElectrifiedMainline
  mod_version: 0.1.4
  factorio_target: "2.1"
  user_tested_game: "2.1.20b"
  last_state_update: "2026-11-10"
  handoff_document: docs/AI_CONTEXT.md
  contributor_instructions: AGENTS.md

user_decisions:
  rail_modernization: replace_vanilla_rails_with_high_speed_rails
  power_model: hybrid_overhead_supply_and_onboard_storage
  rolling_stock: vanilla_and_custom_wagons_supported
  regenerative_braking_priority:
    - shared_grid
    - onboard_storage_surplus
  high_speed_energy_corridor: true
  substations:
    connect_ordinary_grid_and_high_speed_grid: bidirectional
    transfer_power_limit: required
  remote_outpost_power_via_high_speed_corridor: required
  physical_voltage_simulation: not_available_use_MW_limits_buffers_losses
  reference_mod_policy:
    Electrified_Railways: ideas_only_no_code_copying

interoperability:
  vanilla_locomotive_on_vanilla_rails: supported
  vanilla_locomotive_on_custom_rails: supported_as_vanilla
  custom_locomotive_on_custom_rails: planned_grid_plus_storage
  custom_locomotive_on_vanilla_rails: planned_storage_only
  vanilla_and_custom_wagons_mixed: required
  unknown_third_party_rolling_stock: must_not_crash_or_be_controlled

implementation:
  custom_rail_prototypes: four_ground_geometries_present_in_source
  custom_rail_planner: unified_rail_planner_present_in_source
  custom_rail_planner_gameplay: game_tested_operational
  custom_rail_inventory_item: single_em_high_speed_rail_planner
  custom_rail_geometry_item_costs:
    straight: 1
    curved_a: 3
    curved_b: 3
    half_diagonal: 2
  custom_locomotive_prototype: present_in_source
  custom_wagon_prototypes: cloned_from_vanilla_without_capacity_or_performance_changes
  custom_electric_pole: cloned_from_vanilla_small_electric_pole_uses_ordinary_electric_network
  rail_identity_diagnostics: present_in_source_and_game_tested_for_vanilla_and_custom_straight_curved_half_diagonal
  train_tracking: present_in_source
  real_traction_energy: not_implemented
  real_battery_model: not_implemented
  real_substation_transfer: not_implemented
  real_regeneration: not_implemented
  regenerative_braking_technology_effect: recipe_unlock_only_no_battery_capacity_bonus
  complete_rail_replacement: two_stage_upgrade_event_deconstruction_then_custom_rail_ghost_implemented_not_game_tested
  vanilla_to_custom_rail_upgrade_runtime: api_confirmed_source_implemented_game_test_required
  vanilla_to_custom_rail_geometry_mappings:
    straight-rail: em-high-speed-straight-rail
    curved-rail-a: em-curved-high-speed-rail
    curved-rail-b: em-curved-high-speed-rail-b
    half-diagonal-rail: em-half-diagonal-high-speed-rail
  native_factorio_rail_upgrade_by_construction_robot: unsupported_engine_behavior
  rail_replacement_storage_schema_version: 1
  separate_high_speed_power_grid: not_implemented
  rail_planner_construction_robot_placement: game_tested_confirmed
  green_upgrade_planner_rail_replacement_adapter: user_tested_vanilla_custom_pairs_absent_despite_all_eligibility_checks_passing
  custom_rail_replacement_selection_tool: source_implemented_game_test_required
  custom_rail_replacement_selection_scope: whitelist_four_vanilla_ground_rail_geometries
  custom_rail_replacement_runtime_event: on_player_selected_area
  custom_rail_replacement_quality_source: selected_rail_entity_quality
  custom_rail_replacement_robot_workflow: deconstruction_then_matching_custom_rail_ghost
  rail_upgrade_fast_replaceable_group: explicit_shared_group_for_vanilla_and_custom_rails
  rail_upgrade_collision_box_mask_validation: data_final_fixes_assertions_added_game_load_required
  rail_upgrade_planner_eligibility_diagnostics: source_minable_hidden_mining_products_target_visible_build_item_and_geometry_logged
  rail_upgrade_not_upgradable_flag: removed_from_vanilla_and_custom_rail_pairs_if_present
  persistent_storage_lazy_initialization: implemented_not_game_tested
  legacy_save_pending_queue_nil_crash: reproduced_user_reported_fixed_in_0_1_1
  rail_planner_blueprint_behavior: unverified
  custom_rail_planner_manual_placement: operational_user_confirmed
  curved_rail_shape_coverage: both_curved_a_and_b_present_in_source_game_test_not_confirmed
  compatibility_adapters: none
  rail_diagnostic_interval_ticks: 1
  rail_diagnostic_interval_temporary: true
  train_speed_sampling_interval_ticks: 30
  locomotive_energy_source: void_placeholder

