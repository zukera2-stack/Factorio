latest_load_attempt:
  date: "2026-11-10"
  game_version: "2.1.20b"
  tested_mod_version: "0.1.3"
  mod_load_success: true
  inspected_log_runtime_errors_from_mod: none_found
  upgrade_eligibility_diagnostics_all_four_pairs_passed: true
