[mod-setting-name]
em089-experimental-onboard-storage=Experimental onboard energy storage
em089-storage-capacity-mj=Locomotive storage capacity (MJ)
em089-storage-charge-kw=Storage charging power (kW)
em089-storage-discharge-kw=Storage discharge power (kW)
[mod-setting-description]
em089-experimental-onboard-storage=EM089A: finite energy storage on each locomotive. Currently charges only while stopped; disabling preserves the stored energy but disables charging and discharging. Regeneration is not implemented.
em089-storage-capacity-mj=Capacity per locomotive. Reducing the capacity records excess existing energy as a loss.
em089-storage-charge-kw=Maximum charging power per storage unit from a real 25 kV network with available generation.
em089-storage-discharge-kw=Maximum discharge power per storage unit shared by all motors of the coupled train.
