## Descriptions
item-description.em-concrete-beam=Reinforced concrete beam for overhead line support structures.
item-description.em-heavy-copper-cable=Heavy-duty copper cable for electrical overhead lines.
item-description.em-traction-motor=High-power electric traction motor for high-speed locomotives.
item-description.em-battery-bank=Large battery bank for auxiliary power on non-electrified sections.
item-description.em-electric-pole=Based on the vanilla small electric pole. It currently connects to the ordinary electric network; a separate high-speed rail power grid is not implemented yet.
item-description.em-high-speed-rail=Unified planner for placing straight, both curved and half-diagonal high-speed rail segments.
item-description.em-electric-locomotive=High-speed locomotive prototype. Overhead power, onboard battery operation and regenerative braking are not implemented yet.
item-description.em-high-speed-cargo-wagon=Custom cargo wagon based on the vanilla cargo wagon. Capacity and performance currently match the base version.
item-description.em-high-speed-fluid-wagon=Custom fluid wagon based on the vanilla fluid wagon. Capacity and performance currently match the base version.

technology-description.em-electrified-railways=Unlocks core high-speed railway components and electric poles. A separate high-speed rail power grid is not implemented yet.
technology-description.em-high-speed-locomotive=Unlocks the "Mainline" locomotive prototype, traction motor and battery bank. Grid and battery power behavior is not implemented yet.
technology-description.em-regenerative-braking=Unlocks a component reserved for the regenerative braking system. Regenerative energy recovery is not implemented yet.

