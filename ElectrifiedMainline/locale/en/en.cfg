## Descriptions
item-description.em-concrete-beam=Reinforced concrete beam for overhead line support structures.
item-description.em-heavy-copper-cable=Heavy-duty copper cable for electrical overhead lines.
item-description.em-traction-motor=High-power electric traction motor for high-speed locomotives.
item-description.em-battery-bank=Large battery bank for auxiliary power on non-electrified sections.
item-description.em-electric-pole=Visual marker for high-speed rail sections (no direct power transfer in 2.1).
item-description.em-high-speed-rail=High-speed electrified rail section. Train runs at full speed when battery is charged.
item-description.em-curved-high-speed-rail=Curved high-speed rail (180° turn). Manual pole placement recommended.
item-description.em-electric-locomotive=Battery-powered electric locomotive for high-speed travel (600 kW, 1.5 tiles/tick). Features regenerative braking.
item-description.em-high-speed-cargo-wagon=High-speed cargo wagon with 1.5× capacity and increased top speed.
item-description.em-high-speed-fluid-wagon=High-speed fluid wagon with 1.5× capacity and increased top speed.

technology-description.em-electrified-railways=Unlock high-speed electric railway infrastructure: concrete beams, heavy copper cables, electric poles, and high-speed rails.
technology-description.em-high-speed-locomotive=Unlock the electric locomotive "Mainline" (600 kW, 1.5 tiles/tick). Includes battery bank for power reserve.
technology-description.em-regenerative-braking=Enhance regenerative braking efficiency. Improved energy recovery during deceleration.

