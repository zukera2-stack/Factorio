[item-description]
em-35kv-catenary-pole=Overhead mast for electrifying high-speed rails. Connects trains to the isolated 25 kV network. Alt + left click places it at the nearest rail slot.
em-35kv-catenary-pole-north=Shortened 25 kV catenary mast for the northern position.
em-35kv-traction-substation=Bidirectional bridge between the factory and overhead networks. Rated 20 MW per substation; parallel substations combine available power.
em-battery-bank=Component for locomotive and battery-wagon batteries. Does not itself store game energy.
em-battery-wagon=Adds 500 kW traction. Built-in battery: 600 MJ capacity, up to 5 MW charging and 10 MW discharge (defaults). Powers train motors when line power is insufficient. Charges after locomotive batteries. No cargo inventory.
em-concrete-beam=Reinforced concrete beam for overhead line support structures.
em-electric-locomotive=2 MW traction, powered by the 25 kV overhead line and a built-in battery (60 MJ by default). Pantograph raises on departure. Braking energy is returned to the overhead network first, then to train batteries.
em-heavy-copper-cable=Heavy-duty copper cable for electrical overhead lines.
em-high-speed-rail=Unified high-speed rail planner for straight, both curved and half-diagonal segments.
em-motor-cargo-wagon=Carries cargo and adds 500 kW traction via a Mainline locomotive. No separate fuel required.
em-motor-fluid-wagon=Carries fluids and adds 500 kW traction via a Mainline locomotive. No separate fuel required.
em-rail-replacement-planner=Select an area containing vanilla rails. Construction robots will deconstruct them and place ghosts of the matching high-speed rails.
em-regenerative-brake-unit=Legacy component retained for old saves; no longer crafted or used in recipes.
em-traction-motor=Traction motor with integrated regenerative power electronics.

