[mod-setting-description]
em128-charge-at-standstill=Allows locomotive and coupled battery-wagon batteries to charge while stationary with actual powered 25 kV contact. Does not enable traction.
em089-storage-capacity-mj=Capacity per locomotive. Reducing the capacity records excess existing energy as a loss.
em089-storage-charge-kw=Maximum charging power per storage unit from a real 25 kV network with available generation.
em089-storage-discharge-kw=Maximum discharge power per storage unit shared by all motors of the coupled train.
em107-battery-wagon-capacity-mj=Capacity of one wagon. Default: 600 MJ.
em107-battery-wagon-charge-kw=Maximum charging power of one wagon. Default: 5000 kW.
em107-battery-wagon-discharge-kw=Maximum discharge power of one wagon for traction. Default: 10000 kW.

