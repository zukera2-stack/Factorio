[item-description]
em-concrete-beam=Reinforced concrete beam for overhead line support structures.
em-heavy-copper-cable=Heavy-duty copper cable for electrical overhead lines.
em-traction-motor=High-power electric traction motor for high-speed locomotives.
em-battery-bank=Large battery bank for auxiliary power on non-electrified sections.
em-electric-pole=Ordinary electric pole, not a 25 kV catenary mast. Connects only to the factory-side network.
em-high-speed-rail=Unified planner for placing straight, both curved and half-diagonal high-speed rail segments.
em-electric-locomotive=High-speed locomotive prototype. Overhead power, onboard battery operation and regenerative braking are not implemented yet.
em-regenerative-brake-unit=Equipment used by the locomotive's regenerative braking system.
em-rail-replacement-planner=Select an area containing vanilla rails. Construction robots will deconstruct them and place ghosts of the matching high-speed rails.
em-35kv-catenary-pole=25 kV overhead mast. Connected to its own hidden native grid anchor along real HSR; click to inspect the line network. /em-25kv-network logs native IDs. Traction power use is not implemented.
em-35kv-traction-substation=Automatic reversible 20 MW bridge between the line and ordinary power grid. Supports outpost battery charging and backup supply. /em-25kv-mode auto, import, export, off or status. Traction power use not implemented.

[technology-description]
em-electrified-railways=Unlocks core high-speed railway components and electric poles. A separate high-speed rail power grid is not implemented yet.
em-high-speed-locomotive=Unlocks the "Mainline" locomotive prototype, traction motor and battery bank. Grid and battery power behavior is not implemented yet.
em-regenerative-braking=Unlocks a component reserved for the regenerative braking system. Regenerative energy recovery is not implemented yet.
em-high-speed-rails=Unlocks the unified high-speed rail planner with all four track geometries: straight, two curves and half-diagonal.

