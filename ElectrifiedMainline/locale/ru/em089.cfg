[mod-setting-name]
em089-experimental-onboard-storage=Экспериментальный бортовой накопитель
em089-storage-capacity-mj=Ёмкость накопителя электровоза (МДж)
em089-storage-charge-kw=Мощность заряда накопителя (кВт)
em089-storage-discharge-kw=Мощность разряда накопителя (кВт)
[mod-setting-description]
em089-experimental-onboard-storage=EM089A: конечный запас энергии на каждом электровозе. Пока заряд только на стоянке; выключение сохраняет запас, но отключает заряд и разряд. Рекуперация ещё не реализована.
em089-storage-capacity-mj=Ёмкость одного электровоза. При уменьшении ёмкости избыток старого запаса учитывается как потеря.
em089-storage-charge-kw=Предельная мощность заряда одного накопителя от реальной сети 25 кВ при доступной генерации.
em089-storage-discharge-kw=Предельная мощность одного накопителя на все двигатели сцепленного состава.
