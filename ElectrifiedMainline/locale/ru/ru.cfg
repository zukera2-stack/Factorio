[item-description]
em-concrete-beam=Усиленная бетонная балка для конструкций контактной сети.
em-heavy-copper-cable=Тяжёлый медный провод для электрических контактных сетей.
em-traction-motor=Высокомощный тяговый электродвигатель для высокоскоростных электровозов.
em-battery-bank=Большой батарейный блок для резервного питания на неэлектрифицированных участках.
em-electric-pole=Опора на основе малого электрического столба Factorio. Сейчас подключается к обычной электросети; отдельная энергосеть ВСМ ещё не реализована.
em-high-speed-rail=Единый планировщик для прокладки прямых, двух типов кривых и полудиагональных рельсов ВСМ.
em-electric-locomotive=Прототип электровоза ВСМ. Питание от контактной сети, бортовой аккумулятор и рекуперация пока не реализованы.
em-regenerative-brake-unit=Оборудование для системы рекуперативного торможения электровоза.
em-rail-replacement-planner=Выделите область с ванильными рельсами. Роботы демонтируют их и установят призраки соответствующих рельсов ВСМ.
em-35kv-catenary-pole=Опора контактной сети 25 кВ. Штатные провода соединяются автоматически только вдоль связанных рельсов ВСМ. Реальная тяговая мощность пока не передаётся.
em-35kv-traction-substation=Подстанция для будущей контактной сети 25 кВ. Энергетический мост к тяговой сети пока не реализован.

[technology-description]
em-electrified-railways=Открывает базовые компоненты инфраструктуры ВСМ и электрические опоры. Передача энергии по отдельной сети ВСМ пока не реализована.
em-high-speed-locomotive=Открывает прототип электровоза «Магистраль», тяговый двигатель и батарейный блок. Работа питания от сети и аккумулятора пока не реализована.
em-regenerative-braking=Открывает компонент системы рекуперативного торможения. Сама механика рекуперации пока не реализована.
em-high-speed-rails=Открывает единый планировщик ВСМ со всеми четырьмя типами геометрии: прямой, двумя кривыми и полудиагональной.

