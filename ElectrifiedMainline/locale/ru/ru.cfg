## Descriptions
item-description.em-concrete-beam=Усиленная бетонная балка для конструкций контактной сети.
item-description.em-heavy-copper-cable=Тяжёлый медный провод для электрических контактных сетей.
item-description.em-traction-motor=Высокомощный тяговый электродвигатель для высокоскоростных электровозов.
item-description.em-battery-bank=Большой батарейный блок для резервного питания на неэлектрифицированных участках.
item-description.em-electric-pole=Визуальный маркер для участков высокоскоростных рельсов (в 2.1 не передаёт энергию).
item-description.em-high-speed-rail=Высокоскоростной рельс с контактной сетью. Максимальная скорость: 450 км/ч.
item-description.em-curved-high-speed-rail=Высокоскоростной изогнутый рельс (поворот на 180°). Рекомендуется ручная установка опор.
item-description.em-electric-locomotive=Электровоз, питающийся от контактной сети. Имеет резервный аккумулятор и рекуперативное торможение.
item-description.em-high-speed-cargo-wagon=Высокоскоростной грузовой вагон с вместимостью ×1.5 и повышенной максимальной скоростью.
item-description.em-high-speed-fluid-wagon=Высокосоростная цистерна с вместимостью ×1.5 и повышенной максимальной скоростью.

tech-description.em-electrified-railways=Разблокируйте возможность электрификации железнодорожных сетей контактной сетью и строительства высокоскоростной инфраструктуры.
tech-description.em-high-speed-locomotive=Разблокируйте электровоз «Магистраль» с улучшенным ускорением и скоростью при подключении к контактной сети.
tech-description.em-regenerative-braking=Увеличьте эффективность аккумуляторов с помощью рекуперативного торможения. Увеличивает ёмкость батарей на 50%.

