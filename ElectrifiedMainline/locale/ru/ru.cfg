[mod-setting-description]
em128-charge-at-standstill=Разрешает зарядку батарей электровоза и сцепленных аккумуляторных вагонов на стоянке при наличии питания 25 кВ и контакта с проводом. Не включает тягу.
em089-storage-capacity-mj=Ёмкость одного электровоза. При уменьшении ёмкости избыток старого запаса учитывается как потеря.
em089-storage-charge-kw=Предельная мощность заряда одного накопителя от реальной сети 25 кВ при доступной генерации.
em089-storage-discharge-kw=Предельная мощность одного накопителя на все двигатели сцепленного состава.
em107-battery-wagon-capacity-mj=Ёмкость одного вагона. По умолчанию 600 МДж.
em107-battery-wagon-charge-kw=Максимальная мощность зарядки одного вагона. По умолчанию 5000 кВт.
em107-battery-wagon-discharge-kw=Максимальная мощность разрядки одного вагона на тягу. По умолчанию 10000 кВт.

