[technology-description]
em-battery-rolling-stock=Открывает производство моторного аккумуляторного вагона со встроенной батареей для питания двигателей состава.
em-electrified-railways=Открывает бетонные балки, тяжёлый провод, контактные опоры и тяговые подстанции 25 кВ.
em-high-speed-locomotive=Открывает электровоз «Магистраль», моторные грузовые вагоны и цистерны, тяговые двигатели и аккумуляторные блоки.
em-high-speed-rails=Открывает единый планировщик ВСМ со всеми четырьмя типами геометрии: прямой, двумя кривыми и полудиагональной.
em-regenerative-braking=Предварительное исследование аккумуляторного подвижного состава. При торможении энергия возвращается сначала в контактную сеть, затем в батареи состава.

