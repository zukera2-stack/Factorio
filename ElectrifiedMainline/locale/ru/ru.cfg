[item-description]
em-35kv-catenary-pole=Контактная опора для электрификации рельсов ВСМ. Подключает составы к изолированной сети 25 кВ. Alt + ЛКМ — установка у ближайшего рельса.
em-35kv-catenary-pole-north=Укороченная опора контактной сети 25 кВ для северного положения.
em-35kv-traction-substation=Двунаправленный мост между заводской и контактной сетями. Номинальная мощность 20 МВт на подстанцию; параллельные подстанции суммируют доступную мощность.
em-battery-bank=Компонент батарей электровоза и аккумуляторного вагона. Сам по себе не хранит игровую энергию.
em-battery-wagon=Добавляет 500 кВт тяги. Встроенная батарея: 600 МДж, зарядка до 5 МВт, разрядка до 10 МВт (по умолчанию). Питает двигатели состава при недостатке питания от сети. Заряжается после батарей электровозов. Не перевозит груз.
em-concrete-beam=Усиленная бетонная балка для конструкций контактной сети.
em-electric-locomotive=Тяга 2 МВт. Питание от контактной сети 25 кВ и встроенной батареи (60 МДж по умолчанию). Пантограф поднимается при отправлении. При торможении возвращает энергию сначала в контактную сеть, затем в батареи состава.
em-heavy-copper-cable=Тяжёлый медный провод для электрических контактных сетей.
em-high-speed-rail=Единый рельсовый планировщик ВСМ: прямые, кривые двух типов и полудиагональные участки.
em-motor-cargo-wagon=Перевозит груз и добавляет 500 кВт тяги через электровоз «Магистраль». Отдельное топливо не требуется.
em-motor-fluid-wagon=Перевозит жидкости и добавляет 500 кВт тяги через электровоз «Магистраль». Отдельное топливо не требуется.
em-rail-replacement-planner=Выделите область с ванильными рельсами. Роботы демонтируют их и установят призраки соответствующих рельсов ВСМ.
em-regenerative-brake-unit=Устаревший компонент. Сохранён для совместимости со старыми сохранениями; больше не производится и не используется в рецептах.
em-traction-motor=Тяговый двигатель со встроенной силовой электроникой рекуперации.

