## Descriptions
item-description.em-concrete-beam=Усиленная бетонная балка для конструкций контактной сети.
item-description.em-heavy-copper-cable=Тяжёлый медный провод для электрических контактных сетей.
item-description.em-traction-motor=Высокомощный тяговый электродвигатель для высокоскоростных электровозов.
item-description.em-battery-bank=Большой батарейный блок для резервного питания на неэлектрифицированных участках.
item-description.em-electric-pole=Опора на основе малого электрического столба Factorio. Сейчас подключается к обычной электросети; отдельная энергосеть ВСМ ещё не реализована.
item-description.em-high-speed-rail=Единый планировщик для прокладки прямых, двух типов кривых и полудиагональных рельсов ВСМ.
item-description.em-electric-locomotive=Прототип электровоза ВСМ. Питание от контактной сети, бортовой аккумулятор и рекуперация пока не реализованы.
item-description.em-high-speed-cargo-wagon=Грузовой вагон ВСМ на основе ванильного грузового вагона. Вместимость и характеристики пока соответствуют базовой версии.
item-description.em-high-speed-fluid-wagon=Цистерна ВСМ на основе ванильной цистерны. Вместимость и характеристики пока соответствуют базовой версии.

technology-description.em-electrified-railways=Открывает базовые компоненты инфраструктуры ВСМ и электрические опоры. Передача энергии по отдельной сети ВСМ пока не реализована.
technology-description.em-high-speed-locomotive=Открывает прототип электровоза «Магистраль», тяговый двигатель и батарейный блок. Работа питания от сети и аккумулятора пока не реализована.
technology-description.em-regenerative-braking=Открывает компонент системы рекуперативного торможения. Сама механика рекуперации пока не реализована.

